  <g class="ui"><rect x="54" y="52" width="78" height="56" rx="15" fill="#fff" opacity=".18"/><text class="title" x="93" y="90" text-anchor="middle" font-size="23">D04</text>
  <text class="title" x="155" y="76">Write simple calculation software</text><text class="subtitle" x="155" y="106">Weeks 6–9 · Adaptive Electroformed 3D Power Topology Lite student project</text>
  <rect x="968" y="52" width="172" height="56" rx="14" fill="#153758" opacity=".86"/><text class="subtitle" x="1054" y="72" text-anchor="middle">Phase gate</text><text class="gateValue" x="1054" y="101" text-anchor="middle">G2</text></g>
  <g class="ui" transform="translate(28,156)"><rect width="1144" height="64" rx="16" fill="#fff" stroke="#cbdce8"/><text class="section" x="26" y="27" text-anchor="start"><tspan x="26" dy="0">WHY THIS PHASE EXISTS</tspan></text><text class="body" x="26" y="50" text-anchor="start"><tspan x="26" dy="0">Turn equations and raw measurements into transparent, tested calculations and one repeatable report.</tspan></text></g>
  <g class="ui"><g transform="translate(28,238)"><rect width="240" height="158" rx="18" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.5"/><text class="section" x="18" y="28">INPUTS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">mission limits</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">geometry and material</tspan><tspan x="32" dy="17">values</tspan></text><circle cx="20" cy="118" r="3.5" fill="currentColor"/><text class="body" x="32" y="123" text-anchor="start"><tspan x="32" dy="0">Comma-Separated Values</tspan><tspan x="32" dy="17">measurement format</tspan></text></g><g transform="translate(28,410)"><rect width="240" height="144" rx="18" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.5"/><text class="section" x="18" y="28">TOOLS AND MATERIALS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">Python</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">code editor</tspan></text><circle cx="20" cy="101" r="3.5" fill="currentColor"/><text class="body" x="32" y="106" text-anchor="start"><tspan x="32" dy="0">pytest automated checks</tspan></text></g><g transform="translate(28,568)"><rect width="240" height="176" rx="18" fill="#fff8ef" stroke="#dd6b35" stroke-width="1.5"/><text class="section" x="18" y="28">SAFETY / STOP</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">software never replaces</tspan><tspan x="32" dy="17">the physical stop</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">retain original raw data</tspan></text><circle cx="20" cy="118" r="3.5" fill="currentColor"/><text class="body" x="32" y="123" text-anchor="start"><tspan x="32" dy="0">failed tests block later</tspan><tspan x="32" dy="17">analysis</tspan></text></g></g>
  <g class="ui"><text class="detailHeading" x="302" y="190">Student action flow</text><g transform="translate(300,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#4d8cf2"/><text class="stepNumber" x="22" y="27" text-anchor="middle">1</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Store inputs</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Keep mission, geometry</tspan><tspan x="75" dy="14">and material values in</tspan><tspan x="75" dy="14">clear modules.</tspan></text></g><path class="arrow" d="M451 272L468 272"/><g transform="translate(470,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#4d8cf2"/><text class="stepNumber" x="22" y="27" text-anchor="middle">2</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Calculate</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Implement resistance,</tspan><tspan x="75" dy="14">power and temperature</tspan><tspan x="75" dy="14">estimates.</tspan></text></g><path class="arrow" d="M621 272L638 272"/><g transform="translate(640,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#4d8cf2"/><text class="stepNumber" x="22" y="27" text-anchor="middle">3</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Read data</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Import logger tables</tspan><tspan x="75" dy="14">without editing the</tspan><tspan x="75" dy="14">originals.</tspan></text></g><path class="arrow" d="M791 272L808 272"/><g transform="translate(810,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#4d8cf2"/><text class="stepNumber" x="22" y="27" text-anchor="middle">4</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Test code</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Check units, limits</tspan><tspan x="75" dy="14">and hand-calculation</tspan><tspan x="75" dy="14">examples.</tspan></text></g><path class="arrow" d="M961 272L978 272"/><g transform="translate(980,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#4d8cf2"/><text class="stepNumber" x="22" y="27" text-anchor="middle">5</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Report</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Create one comparison</tspan><tspan x="75" dy="14">table and one figure.</tspan></text></g><rect x="288" y="362" width="884" height="280" rx="20" fill="#f8fbfd" stroke="#cbdce8"/><g transform="translate(320,405)"><rect width="165" height="58" rx="13" fill="#f5f9fd" stroke="#4d8cf2" stroke-width="1.4"/><text class="miniTitle" x="82.5" y="27" text-anchor="middle"><tspan x="82.5" dy="0">Mission limits</tspan></text><text class="miniBody" x="82.5" y="52" text-anchor="middle"><tspan x="82.5" dy="0">5 V · 2 A · 50 °C</tspan></text></g><g transform="translate(320,477)"><rect width="165" height="58" rx="13" fill="#f5f9fd" stroke="#4d8cf2" stroke-width="1.4"/><text class="miniTitle" x="82.5" y="27" text-anchor="middle"><tspan x="82.5" dy="0">Geometry</tspan></text><text class="miniBody" x="82.5" y="52" text-anchor="middle"><tspan x="82.5" dy="0">length · width ·</tspan><tspan x="82.5" dy="14">thickness</tspan></text></g><g transform="translate(320,549)"><rect width="165" height="58" rx="13" fill="#f5f9fd" stroke="#4d8cf2" stroke-width="1.4"/><text class="miniTitle" x="82.5" y="27" text-anchor="middle"><tspan x="82.5" dy="0">Raw CSV</tspan></text><text class="miniBody" x="82.5" y="52" text-anchor="middle"><tspan x="82.5" dy="0">logger measurements</tspan></text></g><g transform="translate(520,440)"><rect width="108" height="76" rx="13" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><text class="miniTitle" x="54.0" y="27" text-anchor="middle"><tspan x="54.0" dy="0">geometry.py</tspan></text><text class="miniBody" x="54.0" y="52" text-anchor="middle"><tspan x="54.0" dy="0">dimensions</tspan></text></g><path class="arrow" d="M628 478L639 478"/><g transform="translate(642,440)"><rect width="108" height="76" rx="13" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><text class="miniTitle" x="54.0" y="27" text-anchor="middle"><tspan x="54.0" dy="0">electrical.py</tspan></text><text class="miniBody" x="54.0" y="52" text-anchor="middle"><tspan x="54.0" dy="0">R and P</tspan></text></g><path class="arrow" d="M750 478L761 478"/><g transform="translate(764,440)"><rect width="108" height="76" rx="13" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><text class="miniTitle" x="54.0" y="27" text-anchor="middle"><tspan x="54.0" dy="0">thermal.py</tspan></text><text class="miniBody" x="54.0" y="52" text-anchor="middle"><tspan x="54.0" dy="0">ΔT estimate</tspan></text></g><path class="arrow" d="M872 478L883 478"/><g transform="translate(886,440)"><rect width="108" height="76" rx="13" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><text class="miniTitle" x="54.0" y="27" text-anchor="middle"><tspan x="54.0" dy="0">analysis.py</tspan></text><text class="miniBody" x="54.0" y="52" text-anchor="middle"><tspan x="54.0" dy="0">compare</tspan></text></g><path class="arrow" d="M994 478L1005 478"/><g transform="translate(1008,440)"><rect width="108" height="76" rx="13" fill="#ffffff" stroke="#4d8cf2" stroke-width="1.4"/><text class="miniTitle" x="54.0" y="27" text-anchor="middle"><tspan x="54.0" dy="0">reporting.py</tspan></text><text class="miniBody" x="54.0" y="52" text-anchor="middle"><tspan x="54.0" dy="0">table +</tspan><tspan x="54.0" dy="14">figure</tspan></text></g><path class="signal" d="M485 434H520M485 506H520M485 578H500V500H520"/><g transform="translate(600,555)"><rect width="260" height="62" rx="13" fill="#edf8f6" stroke="#4d8cf2" stroke-width="1.4"/><text class="miniTitle" x="130.0" y="27" text-anchor="middle"><tspan x="130.0" dy="0">Automated tests</tspan></text><text class="miniBody" x="130.0" y="52" text-anchor="middle"><tspan x="130.0" dy="0">hand examples · units · limits ·</tspan><tspan x="130.0" dy="14">invalid data</tspan></text></g><path class="returnArrow" d="M730 555V532C730 525 680 525 680 516"/></g>
  <g class="ui" transform="translate(288,660)"><rect width="430" height="154" rx="18" fill="#fff" stroke="#4d8cf2" stroke-width="1.5"/><text class="section" x="20" y="29">EVIDENCE PRODUCED</text><circle cx="22" cy="53" r="3.5" fill="currentColor"/><text class="body" x="34" y="58" text-anchor="start"><tspan x="34" dy="0">readable source files</tspan></text><circle cx="22" cy="78" r="3.5" fill="currentColor"/><text class="body" x="34" y="83" text-anchor="start"><tspan x="34" dy="0">automated test results</tspan></text><circle cx="22" cy="103" r="3.5" fill="currentColor"/><text class="body" x="34" y="108" text-anchor="start"><tspan x="34" dy="0">example input dataset</tspan></text><circle cx="22" cy="128" r="3.5" fill="currentColor"/><text class="body" x="34" y="133" text-anchor="start"><tspan x="34" dy="0">reproducible report output</tspan></text></g>
  <g class="ui" transform="translate(736,660)"><rect width="436" height="154" rx="18" fill="#294d75"/><text class="gateTitle" x="22" y="34">PASS / FAIL — G2</text><text class="gateBody" x="22" y="62" text-anchor="start"><tspan x="22" dy="0">Software agrees with approved hand calculations and</tspan><tspan x="22" dy="18">fails clearly when inputs or limits are invalid.</tspan></text></g>
  <g class="ui" transform="translate(288,832)"><rect width="884" height="60" rx="16" fill="#edf8f6" stroke="#4d8cf2"/><text class="section" x="20" y="25">HANDOFF TO THE NEXT PHASE</text><text class="handoff" x="260" y="36" text-anchor="start"><tspan x="260" dy="0">Use the verified model during design freeze and testing.</tspan></text></g>

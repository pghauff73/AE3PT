<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">D04 — Write simple calculation software</title>
  <desc id="desc">Write simple calculation software, Weeks 6–9. The diagram shows required inputs, tools, safety controls, five student actions, phase-specific system detail, evidence, G2, and the handoff.</desc>

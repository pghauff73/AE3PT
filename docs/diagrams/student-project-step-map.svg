<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">AE3PT-Lite complete project-step diagram coverage map</title>
  <desc id="desc">Nine linked teaching phases from scope approval to final decision. Every phase diagram covers inputs, actions, tools, safety controls, evidence, a pass or fail gate, and a handoff.</desc>
  <defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#147c88"/><stop offset=".55" stop-color="#346bb9"/><stop offset="1" stop-color="#704ab5"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17364a" flood-opacity=".12"/></filter><style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font:800 34px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.subtitle{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#e6f2ff}.code{font:850 26px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.week{font:650 11px Inter,Segoe UI,Arial,sans-serif;fill:#eef7ff}.cardTitle{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#18384d}.cardBody{font:500 11px Inter,Segoe UI,Arial,sans-serif;fill:#587286}.gate{font:800 11px Inter,Segoe UI,Arial,sans-serif;fill:#23465d}.coverage{font:650 10px Inter,Segoe UI,Arial,sans-serif;fill:#6b8292}.legendTitle{font:800 14px Inter,Segoe UI,Arial,sans-serif;fill:#214158}.legend{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#587286}</style></defs>
  <rect width="1400" height="940" rx="28" fill="#edf3f8"/><rect x="28" y="28" width="1344" height="116" rx="22" fill="url(#header)"/>
  <g class="ui"><text class="title" x="62" y="76">Complete project-step diagram coverage</text><text class="subtitle" x="62" y="108">Adaptive Electroformed 3D Power Topology Lite · nine phases · 24 weeks · Gate G0 to Gate G7</text><rect x="1140" y="52" width="196" height="66" rx="15" fill="#18395d" opacity=".88"/><text class="subtitle" x="1238" y="78" text-anchor="middle">Coverage requirement</text><text class="title" x="1238" y="104" text-anchor="middle" font-size="19">9 of 9 phases</text></g>
  <g class="ui" transform="translate(48,180)"><rect width="400" height="178" rx="19" fill="#fff" stroke="#18a79e" stroke-width="2" filter="url(#shadow)"/><rect width="82" height="178" rx="19" fill="#18a79e"/><text class="code" x="41" y="73" text-anchor="middle">D01</text><text class="week" x="41" y="102" text-anchor="middle">Weeks 1–2</text><text class="cardTitle" x="105" y="37" text-anchor="start"><tspan x="105" dy="0">Understand and approve</tspan></text><text class="cardBody" x="105" y="86" text-anchor="start"><tspan x="105" dy="0">Turn the idea into one safe, shared and</tspan><tspan x="105" dy="16">explainable classroom mission before any building</tspan><tspan x="105" dy="16">begins.</tspan></text><rect x="104" y="132" width="104" height="28" rx="14" fill="#18a79e" opacity=".14"/><text class="gate" x="156" y="151" text-anchor="middle">G0</text><text class="coverage" x="224" y="150">inputs · actions · safety · evidence</text></g><g class="ui" transform="translate(496,180)"><rect width="400" height="178" rx="19" fill="#fff" stroke="#2f78db" stroke-width="2" filter="url(#shadow)"/><rect width="82" height="178" rx="19" fill="#2f78db"/><text class="code" x="41" y="73" text-anchor="middle">D02</text><text class="week" x="41" y="102" text-anchor="middle">Weeks 3–5</text><text class="cardTitle" x="105" y="37" text-anchor="start"><tspan x="105" dy="0">Calculate and print</tspan><tspan x="105" dy="20">coupons</tspan></text><text class="cardBody" x="105" y="86" text-anchor="start"><tspan x="105" dy="0">Use simple electrical calculations and small</tspan><tspan x="105" dy="16">prints to learn before committing material to</tspan><tspan x="105" dy="16">nine samples.</tspan></text><rect x="104" y="132" width="104" height="28" rx="14" fill="#2f78db" opacity=".14"/><text class="gate" x="156" y="151" text-anchor="middle">Prep gate</text><text class="coverage" x="224" y="150">inputs · actions · safety · evidence</text></g><g class="ui" transform="translate(944,180)"><rect width="400" height="178" rx="19" fill="#fff" stroke="#7659d7" stroke-width="2" filter="url(#shadow)"/><rect width="82" height="178" rx="19" fill="#7659d7"/><text class="code" x="41" y="73" text-anchor="middle">D03</text><text class="week" x="41" y="102" text-anchor="middle">Weeks 4–7</text><text class="cardTitle" x="105" y="37" text-anchor="start"><tspan x="105" dy="0">Build the measurement</tspan><tspan x="105" dy="20">tools</tspan></text><text class="cardBody" x="105" y="86" text-anchor="start"><tspan x="105" dy="0">Build low-voltage instruments that measure</tspan><tspan x="105" dy="16">current, sample voltage and four temperatures</tspan><tspan x="105" dy="16">with traceable checks.</tspan></text><rect x="104" y="132" width="104" height="28" rx="14" fill="#7659d7" opacity=".14"/><text class="gate" x="156" y="151" text-anchor="middle">G1</text><text class="coverage" x="224" y="150">inputs · actions · safety · evidence</text></g><g class="ui" transform="translate(48,398)"><rect width="400" height="178" rx="19" fill="#fff" stroke="#4d8cf2" stroke-width="2" filter="url(#shadow)"/><rect width="82" height="178" rx="19" fill="#4d8cf2"/><text class="code" x="41" y="73" text-anchor="middle">D04</text><text class="week" x="41" y="102" text-anchor="middle">Weeks 6–9</text><text class="cardTitle" x="105" y="37" text-anchor="start"><tspan x="105" dy="0">Write simple calculation</tspan><tspan x="105" dy="20">software</tspan></text><text class="cardBody" x="105" y="86" text-anchor="start"><tspan x="105" dy="0">Turn equations and raw measurements into</tspan><tspan x="105" dy="16">transparent, tested calculations and one</tspan><tspan x="105" dy="16">repeatable report.</tspan></text><rect x="104" y="132" width="104" height="28" rx="14" fill="#4d8cf2" opacity=".14"/><text class="gate" x="156" y="151" text-anchor="middle">G2</text><text class="coverage" x="224" y="150">inputs · actions · safety · evidence</text></g><g class="ui" transform="translate(496,398)"><rect width="400" height="178" rx="19" fill="#fff" stroke="#18a98f" stroke-width="2" filter="url(#shadow)"/><rect width="82" height="178" rx="19" fill="#18a98f"/><text class="code" x="41" y="73" text-anchor="middle">D05</text><text class="week" x="41" y="102" text-anchor="middle">Weeks 8–11</text><text class="cardTitle" x="105" y="37" text-anchor="start"><tspan x="105" dy="0">Freeze and print three</tspan><tspan x="105" dy="20">designs</tspan></text><text class="cardBody" x="105" y="86" text-anchor="start"><tspan x="105" dy="0">Create a fair three-design comparison with common</tspan><tspan x="105" dy="16">terminals, traceable samples and an approved seed</tspan><tspan x="105" dy="16">route.</tspan></text><rect x="104" y="132" width="104" height="28" rx="14" fill="#18a98f" opacity=".14"/><text class="gate" x="156" y="151" text-anchor="middle">G3/G4 prep</text><text class="coverage" x="224" y="150">inputs · actions · safety · evidence</text></g><g class="ui" transform="translate(944,398)"><rect width="400" height="178" rx="19" fill="#fff" stroke="#f28d3c" stroke-width="2" filter="url(#shadow)"/><rect width="82" height="178" rx="19" fill="#f28d3c"/><text class="code" x="41" y="73" text-anchor="middle">D06</text><text class="week" x="41" y="102" text-anchor="middle">Weeks 11–14</text><text class="cardTitle" x="105" y="37" text-anchor="start"><tspan x="105" dy="0">Apply conductive seed and</tspan><tspan x="105" dy="20">copper</tspan></text><text class="cardBody" x="105" y="86" text-anchor="start"><tspan x="105" dy="0">Use an approved seed and coupon-first laboratory</tspan><tspan x="105" dy="16">process to make traceable copper-coated</tspan><tspan x="105" dy="16">conductors.</tspan></text><rect x="104" y="132" width="104" height="28" rx="14" fill="#f28d3c" opacity=".14"/><text class="gate" x="156" y="151" text-anchor="middle">G4</text><text class="coverage" x="224" y="150">inputs · actions · safety · evidence</text></g><g class="ui" transform="translate(48,616)"><rect width="400" height="178" rx="19" fill="#fff" stroke="#55bd70" stroke-width="2" filter="url(#shadow)"/><rect width="82" height="178" rx="19" fill="#55bd70"/><text class="code" x="41" y="73" text-anchor="middle">D07</text><text class="week" x="41" y="102" text-anchor="middle">Weeks 15–18</text><text class="cardTitle" x="105" y="37" text-anchor="start"><tspan x="105" dy="0">Test all nine samples</tspan></text><text class="cardBody" x="105" y="86" text-anchor="start"><tspan x="105" dy="0">Measure every design at the same low-voltage</tspan><tspan x="105" dy="16">conditions so electrical, thermal and</tspan><tspan x="105" dy="16">manufacturing differences are comparable.</tspan></text><rect x="104" y="132" width="104" height="28" rx="14" fill="#55bd70" opacity=".14"/><text class="gate" x="156" y="151" text-anchor="middle">G5</text><text class="coverage" x="224" y="150">inputs · actions · safety · evidence</text></g><g class="ui" transform="translate(496,616)"><rect width="400" height="178" rx="19" fill="#fff" stroke="#e6538d" stroke-width="2" filter="url(#shadow)"/><rect width="82" height="178" rx="19" fill="#e6538d"/><text class="code" x="41" y="73" text-anchor="middle">D08</text><text class="week" x="41" y="102" text-anchor="middle">Weeks 19–21</text><text class="cardTitle" x="105" y="37" text-anchor="start"><tspan x="105" dy="0">Damage, repair and retest</tspan></text><text class="cardBody" x="105" y="86" text-anchor="start"><tspan x="105" dy="0">Create a controlled local defect, restore copper</tspan><tspan x="105" dy="16">under supervision and measure whether useful</tspan><tspan x="105" dy="16">performance returns.</tspan></text><rect x="104" y="132" width="104" height="28" rx="14" fill="#e6538d" opacity=".14"/><text class="gate" x="156" y="151" text-anchor="middle">G6</text><text class="coverage" x="224" y="150">inputs · actions · safety · evidence</text></g><g class="ui" transform="translate(944,616)"><rect width="400" height="178" rx="19" fill="#fff" stroke="#6f4cb8" stroke-width="2" filter="url(#shadow)"/><rect width="82" height="178" rx="19" fill="#6f4cb8"/><text class="code" x="41" y="73" text-anchor="middle">D09</text><text class="week" x="41" y="102" text-anchor="middle">Weeks 22–24</text><text class="cardTitle" x="105" y="37" text-anchor="start"><tspan x="105" dy="0">Explain, present and</tspan><tspan x="105" dy="20">decide</tspan></text><text class="cardBody" x="105" y="86" text-anchor="start"><tspan x="105" dy="0">Turn calculations, physical evidence, costs and</tspan><tspan x="105" dy="16">limitations into a decision another person can</tspan><tspan x="105" dy="16">understand and reproduce.</tspan></text><rect x="104" y="132" width="104" height="28" rx="14" fill="#6f4cb8" opacity=".14"/><text class="gate" x="156" y="151" text-anchor="middle">G7</text><text class="coverage" x="224" y="150">inputs · actions · safety · evidence</text></g>

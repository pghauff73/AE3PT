<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">AE3PT conductive coating method selection map</title>
<desc id="desc">Ten methods grouped as student-built, shared laboratory and advanced service or research routes, with a recommended low-budget progression.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#10243d" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52657a"/></marker>
  <style>
    .title{font:700 34px Inter,Arial,sans-serif;fill:#10243d}
    .subtitle{font:500 18px Inter,Arial,sans-serif;fill:#52657a}
    .section{font:700 18px Inter,Arial,sans-serif;fill:#10243d}
    .boxTitle{font:700 17px Inter,Arial,sans-serif;fill:#10243d}
    .body{font:500 16px Inter,Arial,sans-serif;fill:#31465d}
    .small{font:600 14px Inter,Arial,sans-serif;fill:#52657a}
    .metric{font:800 24px Inter,Arial,sans-serif;fill:#10243d}
    .step{font:800 16px Inter,Arial,sans-serif;fill:#ffffff}
    .arrow{stroke:#52657a;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1400" height="900" fill="#f5f8fc"/>

<rect x="28" y="24" width="1344" height="852" rx="28" fill="#ffffff" filter="url(#shadow)"/>
<text class="title" x="70" y="76">AE3PT Conductive Coating Method Selection Map</text>
<text class="subtitle" x="70" y="110">Begin with the lowest-complexity process that can reach the required geometry.</text>
<g transform="translate(70,146)"><rect width="1260" height="98" rx="18" fill="#eef5ff"/><text class="section" x="22" y="34">Recommended low-budget progression</text><text class="metric" x="22" y="72">C01 DISPENSE → C02 SPRAY → C03 ELECTROLESS LAB → C04–C10 SERVICE ONLY WHEN JUSTIFIED</text></g>
<path class="arrow" d="M436 264H482"/><path class="arrow" d="M872 264H918"/>
<g transform="translate(54,286)"><rect width="420" height="228" rx="22" fill="#ffffff" stroke="#1b9e77" stroke-width="2"/><rect width="420" height="56" rx="22" fill="#1b9e77"/><text class="step" x="20" y="35">STUDENT-BUILT</text><circle cx="28" cy="92" r="17" fill="#1b9e77"/><text class="step" x="28" y="98" text-anchor="middle">01</text><text class="boxTitle" x="58" y="80"><tspan x="58" dy="0">GDC — Gantry-Dispensed Conductive</tspan><tspan x="58" dy="18">Coating</tspan></text><text class="small" x="58" y="130">Difficulty 2/5 · trial $250–$1,000</text><circle cx="28" cy="170" r="17" fill="#2878c8"/><text class="step" x="28" y="176" text-anchor="middle">02</text><text class="boxTitle" x="58" y="158"><tspan x="58" dy="0">RSC — Robotic Airbrush or Spray</tspan><tspan x="58" dy="18">Coating</tspan></text><text class="small" x="58" y="208">Difficulty 3/5 · trial $500–$2,000</text></g><g transform="translate(490,286)"><rect width="420" height="228" rx="22" fill="#ffffff" stroke="#7357b4" stroke-width="2"/><rect width="420" height="56" rx="22" fill="#7357b4"/><text class="step" x="20" y="35">SHARED LAB</text><circle cx="28" cy="92" r="17" fill="#7357b4"/><text class="step" x="28" y="98" text-anchor="middle">03</text><text class="boxTitle" x="58" y="80"><tspan x="58" dy="0">AESC — Automated Electroless Seed</tspan><tspan x="58" dy="18">Coating</tspan></text><text class="small" x="58" y="130">Difficulty 4/5 · trial $500–$2,500</text><circle cx="28" cy="170" r="17" fill="#d95f02"/><text class="step" x="28" y="176" text-anchor="middle">04</text><text class="boxTitle" x="58" y="158"><tspan x="58" dy="0">ICS — Inkjet-Printed Catalyst or</tspan><tspan x="58" dy="18">Metal Seed</tspan></text><text class="small" x="58" y="208">Difficulty 4/5 · trial $1,000–$4,000</text></g><g transform="translate(926,286)"><rect width="420" height="540" rx="22" fill="#ffffff" stroke="#d95f02" stroke-width="2"/><rect width="420" height="56" rx="22" fill="#d95f02"/><text class="step" x="20" y="35">ADVANCED SERVICE / RESEARCH</text><circle cx="28" cy="92" r="17" fill="#e6ab02"/><text class="step" x="28" y="98" text-anchor="middle">05</text><text class="boxTitle" x="58" y="80"><tspan x="58" dy="0">AJP — Aerosol Jet Printed Seed</tspan></text><text class="small" x="58" y="130">Difficulty 5/5 · trial $2,000–$8,000</text><circle cx="28" cy="170" r="17" fill="#7570b3"/><text class="step" x="28" y="176" text-anchor="middle">06</text><text class="boxTitle" x="58" y="158"><tspan x="58" dy="0">LDS — Laser Direct Structuring</tspan></text><text class="small" x="58" y="208">Difficulty 5/5 · trial $2,000–$10,000</text><circle cx="28" cy="248" r="17" fill="#e7298a"/><text class="step" x="28" y="254" text-anchor="middle">07</text><text class="boxTitle" x="58" y="236"><tspan x="58" dy="0">FAM — Flash Ablation Metallization</tspan></text><text class="small" x="58" y="286">Difficulty 5/5 · trial $2,000–$10,000</text><circle cx="28" cy="326" r="17" fill="#66a61e"/><text class="step" x="28" y="332" text-anchor="middle">08</text><text class="boxTitle" x="58" y="314"><tspan x="58" dy="0">PVD — Physical Vapor Deposition Seed</tspan><tspan x="58" dy="18">Layer</tspan></text><text class="small" x="58" y="364">Difficulty 4/5 · trial $1,000–$5,000</text><circle cx="28" cy="404" r="17" fill="#a6761d"/><text class="step" x="28" y="410" text-anchor="middle">09</text><text class="boxTitle" x="58" y="392"><tspan x="58" dy="0">LIG — Laser-Induced Graphene Seed</tspan></text><text class="small" x="58" y="442">Difficulty 4/5 · trial $1,000–$5,000</text><circle cx="28" cy="482" r="17" fill="#1f9ac7"/><text class="step" x="28" y="488" text-anchor="middle">10</text><text class="boxTitle" x="58" y="470"><tspan x="58" dy="0">CLMR — Catalyst-Loaded Multi-Material</tspan><tspan x="58" dy="18">Resin</tspan></text><text class="small" x="58" y="520">Difficulty 5/5 · trial $2,000–$10,000</text></g>
<text class="small" x="70" y="852">Cost bands are AE3PT 2026 planning allowances, not quotations. Difficulty includes process control, safety, metrology and repeatability—not only machine motion.</text>

</svg>

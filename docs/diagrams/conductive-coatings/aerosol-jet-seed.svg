<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">C05 Aerosol Jet Printed Seed plan</title>
<desc id="desc">Difficulty and cost metrics followed by a five-step process from digital input through seed deposition, inspection, copper electroplating and pass or fallback evidence.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#10243d" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52657a"/></marker>
  <style>
    .title{font:700 34px Inter,Arial,sans-serif;fill:#10243d}
    .subtitle{font:500 18px Inter,Arial,sans-serif;fill:#52657a}
    .section{font:700 18px Inter,Arial,sans-serif;fill:#10243d}
    .boxTitle{font:700 17px Inter,Arial,sans-serif;fill:#10243d}
    .body{font:500 16px Inter,Arial,sans-serif;fill:#31465d}
    .small{font:600 14px Inter,Arial,sans-serif;fill:#52657a}
    .metric{font:800 24px Inter,Arial,sans-serif;fill:#10243d}
    .step{font:800 16px Inter,Arial,sans-serif;fill:#ffffff}
    .arrow{stroke:#52657a;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1400" height="900" fill="#f5f8fc"/>

<rect x="28" y="24" width="1344" height="852" rx="28" fill="#ffffff" filter="url(#shadow)"/>
<rect x="28" y="24" width="14" height="852" rx="7" fill="#e6ab02"/>
<text class="title" x="72" y="76">C05 — Aerosol Jet Printed Seed</text>
<text class="subtitle" x="72" y="110">Automated conductive seed plan for a supervised copper electroplating workflow</text>

<g transform="translate(72,142)"><rect width="250" height="78" rx="16" fill="#edf8f6"/><text class="small" x="18" y="27">DIFFICULTY</text><text class="metric" x="18" y="57">5/5</text></g>
<g transform="translate(340,142)"><rect width="300" height="78" rx="16" fill="#eef4ff"/><text class="small" x="18" y="27">STUDENT TRIAL</text><text class="metric" x="18" y="57">$2,000–$8,000</text></g>
<g transform="translate(658,142)"><rect width="310" height="78" rx="16" fill="#fff6e8"/><text class="small" x="18" y="27">OWNERSHIP ALLOWANCE</text><text class="metric" x="18" y="57">$100,000–$500,000</text></g>
<g transform="translate(986,142)"><rect width="346" height="78" rx="16" fill="#f4effb"/><text class="small" x="18" y="27">RECOMMENDED ROLE</text><text class="body" x="18" y="53"><tspan x="18" dy="0">External-service or research-</tspan><tspan x="18" dy="20">facility method</tspan></text></g>

<g transform="translate(40,252)">
  <rect width="240" height="208" rx="18" fill="#ffffff" stroke="#e6ab02" stroke-width="2"/>
  <circle cx="30" cy="30" r="18" fill="#e6ab02"/><text class="step" x="30" y="36" text-anchor="middle">1</text>
  <text class="boxTitle" x="58" y="28"><tspan x="58" dy="0">Digital input</tspan></text>
  <text class="body" x="20" y="72"><tspan x="20" dy="0">Frozen geometry,</tspan><tspan x="20" dy="23">material, path and</tspan><tspan x="20" dy="23">acceptance limits</tspan></text>
</g><g transform="translate(310,252)">
  <rect width="240" height="208" rx="18" fill="#ffffff" stroke="#e6ab02" stroke-width="2"/>
  <circle cx="30" cy="30" r="18" fill="#e6ab02"/><text class="step" x="30" y="36" text-anchor="middle">2</text>
  <text class="boxTitle" x="58" y="28"><tspan x="58" dy="0">Automation cell</tspan></text>
  <text class="body" x="20" y="72"><tspan x="20" dy="0">Aerosol atomiser,</tspan><tspan x="20" dy="23">sheath-gas print head,</tspan><tspan x="20" dy="23">multi-axis stage,</tspan><tspan x="20" dy="23">curing system and</tspan><tspan x="20" dy="23">microscope</tspan></text>
</g><g transform="translate(580,252)">
  <rect width="240" height="208" rx="18" fill="#ffffff" stroke="#e6ab02" stroke-width="2"/>
  <circle cx="30" cy="30" r="18" fill="#e6ab02"/><text class="step" x="30" y="36" text-anchor="middle">3</text>
  <text class="boxTitle" x="58" y="28"><tspan x="58" dy="0">Seed inspection</tspan></text>
  <text class="body" x="20" y="72"><tspan x="20" dy="0">Verify location,</tspan><tspan x="20" dy="23">continuity, adhesion</tspan><tspan x="20" dy="23">and isolation</tspan></text>
</g><g transform="translate(850,252)">
  <rect width="240" height="208" rx="18" fill="#ffffff" stroke="#e6ab02" stroke-width="2"/>
  <circle cx="30" cy="30" r="18" fill="#e6ab02"/><text class="step" x="30" y="36" text-anchor="middle">4</text>
  <text class="boxTitle" x="58" y="28"><tspan x="58" dy="0">Copper thickening</tspan></text>
  <text class="body" x="20" y="72"><tspan x="20" dy="0">Supervised staged</tspan><tspan x="20" dy="23">electroplating with</tspan><tspan x="20" dy="23">recorded contacts</tspan></text>
</g><g transform="translate(1120,252)">
  <rect width="240" height="208" rx="18" fill="#ffffff" stroke="#e6ab02" stroke-width="2"/>
  <circle cx="30" cy="30" r="18" fill="#e6ab02"/><text class="step" x="30" y="36" text-anchor="middle">5</text>
  <text class="boxTitle" x="58" y="28"><tspan x="58" dy="0">Evidence gate</tspan></text>
  <text class="body" x="20" y="72"><tspan x="20" dy="0">Electrical, thermal,</tspan><tspan x="20" dy="23">repeatability, cost</tspan><tspan x="20" dy="23">and fallback decision</tspan></text>
</g>
<path class="arrow" d="M280 346H303"/><path class="arrow" d="M550 346H573"/><path class="arrow" d="M820 346H843"/><path class="arrow" d="M1090 346H1113"/>

<g transform="translate(54,486)"><rect width="404" height="154" rx="18" fill="#eef8ff" stroke="#2878c8" stroke-width="2"/><text class="section" x="22" y="34">Best geometry</text><text class="body" x="22" y="67"><tspan x="22" dy="0">Fine conformal traces over moderate</tspan><tspan x="22" dy="24">three-dimensional relief</tspan></text></g>
<g transform="translate(482,486)"><rect width="404" height="154" rx="18" fill="#fff7e9" stroke="#d28b1f" stroke-width="2"/><text class="section" x="22" y="34">Required seed result</text><text class="body" x="22" y="67"><tspan x="22" dy="0">Fine conformal nanoparticle or catalyst</tspan><tspan x="22" dy="24">seed tracks</tspan></text></g>
<g transform="translate(910,486)"><rect width="436" height="154" rx="18" fill="#fff1f1" stroke="#d84d4d" stroke-width="2"/><text class="section" x="22" y="34">Stop condition</text><text class="body" x="22" y="67"><tspan x="22" dy="0">Any unapproved hazard, misplaced conductor,</tspan><tspan x="22" dy="24">failed continuity, bridging, peeling,</tspan><tspan x="22" dy="24">overheating or uncontrolled process change.</tspan></text></g>

<g transform="translate(54,672)"><rect width="610" height="164" rx="20" fill="#edf8f2" stroke="#31a56c" stroke-width="2"/><text class="section" x="24" y="36">PASS — AJP-G3: Value gate</text><text class="body" x="24" y="72"><tspan x="24" dy="0">The geometry or resolution benefit justifies the measured</tspan><tspan x="24" dy="24">service cost and yield.</tspan></text><text class="small" x="24" y="141">Release only the frozen material + geometry + process recipe.</text></g>
<g transform="translate(692,672)"><rect width="654" height="164" rx="20" fill="#fff1f1" stroke="#d84d4d" stroke-width="2"/><text class="section" x="24" y="36">FAIL — RETURN TO THE FALLBACK</text><text class="body" x="24" y="72"><tspan x="24" dy="0">Use inkjet for planar fine traces, gantry dispensing for wider</tspan><tspan x="24" dy="24">conformal traces, or a dual-material conductive filament when</tspan><tspan x="24" dy="24">resolution is not essential.</tspan></text></g>

</svg>

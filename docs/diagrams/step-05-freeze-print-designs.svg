  <text class="title" x="155" y="76">Freeze and print three designs</text><text class="subtitle" x="155" y="106">Weeks 8–11 · Adaptive Electroformed 3D Power Topology Lite student project</text>
  <rect x="968" y="52" width="172" height="56" rx="14" fill="#153758" opacity=".86"/><text class="subtitle" x="1054" y="72" text-anchor="middle">Phase gate</text><text class="gateValueLong" x="1054" y="85" text-anchor="middle"><tspan x="1054" dy="0">G3 / G4</tspan><tspan x="1054" dy="16">preparation</tspan></text></g>
  <g class="ui" transform="translate(28,156)"><rect width="1144" height="64" rx="16" fill="#fff" stroke="#cbdce8"/><text class="section" x="26" y="27" text-anchor="start"><tspan x="26" dy="0">WHY THIS PHASE EXISTS</tspan></text><text class="body" x="26" y="50" text-anchor="start"><tspan x="26" dy="0">Create a fair three-design comparison with common terminals, traceable samples and an approved seed route.</tspan></text></g>
  <g class="ui"><g transform="translate(28,238)"><rect width="240" height="158" rx="18" fill="#ffffff" stroke="#18a98f" stroke-width="1.5"/><text class="section" x="18" y="28">INPUTS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">coupon-derived print rules</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">electrical predictions</tspan></text><circle cx="20" cy="101" r="3.5" fill="currentColor"/><text class="body" x="32" y="106" text-anchor="start"><tspan x="32" dy="0">common 100 mm × 30 mm</tspan><tspan x="32" dy="17">envelope</tspan></text></g><g transform="translate(28,410)"><rect width="240" height="144" rx="18" fill="#ffffff" stroke="#18a98f" stroke-width="1.5"/><text class="section" x="18" y="28">TOOLS AND MATERIALS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">Computer-Aided Design</tspan><tspan x="32" dy="17">software</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">Artist-D IDEX or approved</tspan><tspan x="32" dy="17">printer</tspan></text><circle cx="20" cy="135" r="3.5" fill="currentColor"/><text class="body" x="32" y="140" text-anchor="start"><tspan x="32" dy="0">calliper, scale and camera</tspan></text></g><g transform="translate(28,568)"><rect width="240" height="176" rx="18" fill="#fff8ef" stroke="#dd6b35" stroke-width="1.5"/><text class="section" x="18" y="28">SAFETY / STOP</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">qualify both nozzles on</tspan><tspan x="32" dy="17">coupons</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">do not change frozen</tspan><tspan x="32" dy="17">geometry silently</tspan></text><circle cx="20" cy="135" r="3.5" fill="currentColor"/><text class="body" x="32" y="140" text-anchor="start"><tspan x="32" dy="0">inspect sharp or failed</tspan><tspan x="32" dy="17">prints before use</tspan></text></g></g>

fill="#d6e2ea"/><path d="M42 95H88L112 82H142L166 95H188V123H166L142 136H112L88 123H42Z" fill="#18a98f"/><text class="badgeText" x="115" y="176" text-anchor="middle">B01 · B02 · B03</text></g><g transform="translate(890,402)"><rect width="230" height="200" rx="16" fill="#fff" stroke="#18a98f" stroke-width="1.4"/><text class="miniTitle" x="115" y="28" text-anchor="middle">Design C</text><text class="miniBody" x="115" y="49" text-anchor="middle">repair-ready</text><rect x="22" y="82" width="25" height="54" rx="5" fill="#d6e2ea"/><rect x="183" y="82" width="25" height="54" rx="5" fill="#d6e2ea"/><rect x="42" y="96" width="146" height="26" rx="8" fill="#18a98f"/><rect x="101" y="91" width="30" height="36" rx="5" fill="#fff" stroke="#e6538d" stroke-width="4"/><circle cx="71" cy="109" r="5" fill="#17364a"/><circle cx="160" cy="109" r="5" fill="#17364a"/><text class="badgeText" x="115" y="176" text-anchor="middle">C01 · C02 · C03</text></g><g transform="translate(410,612)"><rect width="630" height="24" rx="12" fill="#18a98f" opacity=".14"/><text class="badgeText" x="315" y="17" text-anchor="middle">Artist-D option: left PLA body · right conductive seed · coupons before nine samples</text></g></g>
  <g class="ui" transform="translate(288,660)"><rect width="430" height="154" rx="18" fill="#fff" stroke="#18a98f" stroke-width="1.5"/><text class="section" x="20" y="29">EVIDENCE PRODUCED</text><circle cx="22" cy="53" r="3.5" fill="currentColor"/><text class="body" x="34" y="58" text-anchor="start"><tspan x="34" dy="0">three frozen design files</tspan></text><circle cx="22" cy="78" r="3.5" fill="currentColor"/><text class="body" x="34" y="83" text-anchor="start"><tspan x="34" dy="0">nine labelled bases</tspan></text><circle cx="22" cy="103" r="3.5" fill="currentColor"/><text class="body" x="34" y="108" text-anchor="start"><tspan x="34" dy="0">dimension and mass record</tspan></text><circle cx="22" cy="128" r="3.5" fill="currentColor"/><text class="body" x="34" y="133" text-anchor="start"><tspan x="34" dy="0">failed-print and change log</tspan></text></g>

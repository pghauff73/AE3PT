  <title id="title">D05 — Freeze and print three designs</title>
  <desc id="desc">Freeze and print three designs, Weeks 8–11. The diagram shows required inputs, tools, safety controls, five student actions, phase-specific system detail, evidence, G3 / G4 preparation, and the handoff.</desc>

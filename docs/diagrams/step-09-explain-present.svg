  <text class="title" x="155" y="76">Explain, present and decide</text><text class="subtitle" x="155" y="106">Weeks 22–24 · Adaptive Electroformed 3D Power Topology Lite student project</text>
  <rect x="968" y="52" width="172" height="56" rx="14" fill="#153758" opacity=".86"/><text class="subtitle" x="1054" y="72" text-anchor="middle">Phase gate</text><text class="gateValue" x="1054" y="101" text-anchor="middle">G7</text></g>
  <g class="ui" transform="translate(28,156)"><rect width="1144" height="64" rx="16" fill="#fff" stroke="#cbdce8"/><text class="section" x="26" y="27" text-anchor="start"><tspan x="26" dy="0">WHY THIS PHASE EXISTS</tspan></text><text class="body" x="26" y="50" text-anchor="start"><tspan x="26" dy="0">Turn calculations, physical evidence, costs and limitations into a decision another person can understand and reproduce.</tspan></text></g>
  <g class="ui"><g transform="translate(28,238)"><rect width="240" height="158" rx="18" fill="#ffffff" stroke="#6f4cb8" stroke-width="1.5"/><text class="section" x="18" y="28">INPUTS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">source code and</tspan><tspan x="32" dy="17">calculations</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">manufacturing and test</tspan><tspan x="32" dy="17">evidence</tspan></text><circle cx="20" cy="135" r="3.5" fill="currentColor"/><text class="body" x="32" y="140" text-anchor="start"><tspan x="32" dy="0">Bill of Materials and</tspan><tspan x="32" dy="17">actual costs</tspan></text></g><g transform="translate(28,410)"><rect width="240" height="144" rx="18" fill="#ffffff" stroke="#6f4cb8" stroke-width="1.5"/><text class="section" x="18" y="28">TOOLS AND MATERIALS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">report and chart templates</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">demonstration poster or</tspan><tspan x="32" dy="17">video</tspan></text><circle cx="20" cy="118" r="3.5" fill="currentColor"/><text class="body" x="32" y="123" text-anchor="start"><tspan x="32" dy="0">lecturer and non-technical</tspan><tspan x="32" dy="17">review</tspan></text></g><g transform="translate(28,568)"><rect width="240" height="176" rx="18" fill="#fff8ef" stroke="#dd6b35" stroke-width="1.5"/><text class="section" x="18" y="28">SAFETY / STOP</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">separate facts from</tspan><tspan x="32" dy="17">interpretation</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">do not hide failures or</tspan><tspan x="32" dy="17">uncertainty</tspan></text><circle cx="20" cy="135" r="3.5" fill="currentColor"/><text class="body" x="32" y="140" text-anchor="start"><tspan x="32" dy="0">do not claim industrial or</tspan><tspan x="32" dy="17">commercial proof</tspan></text></g></g>
  <g class="ui"><text class="detailHeading" x="302" y="190">Student action flow</text><g transform="translate(300,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#6f4cb8" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#6f4cb8"/><text class="stepNumber" x="22" y="27" text-anchor="middle">1</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Validate</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Check identifiers,</tspan><tspan x="75" dy="14">files, units, totals</tspan><tspan x="75" dy="14">and missing data.</tspan></text></g><path class="arrow" d="M451 272L468 272"/><g transform="translate(470,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#6f4cb8" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#6f4cb8"/><text class="stepNumber" x="22" y="27" text-anchor="middle">2</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Compare value</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Calculate cost per</tspan><tspan x="75" dy="14">success, repair and</tspan><tspan x="75" dy="14">replacement.</tspan></text></g><path class="arrow" d="M621 272L638 272"/><g transform="translate(640,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#6f4cb8" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#6f4cb8"/><text class="stepNumber" x="22" y="27" text-anchor="middle">3</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Explain limits</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">State uncertainty and</tspan><tspan x="75" dy="14">what the project does</tspan><tspan x="75" dy="14">not prove.</tspan></text></g><path class="arrow" d="M791 272L808 272"/><g transform="translate(810,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#6f4cb8" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#6f4cb8"/><text class="stepNumber" x="22" y="27" text-anchor="middle">4</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Review</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Use lecturer and</tspan><tspan x="75" dy="14">non-technical</tspan><tspan x="75" dy="14">translation checks.</tspan></text></g><path class="arrow" d="M961 272L978 272"/><g transform="translate(980,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#6f4cb8" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#6f4cb8"/><text class="stepNumber" x="22" y="27" text-anchor="middle">5</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Recommend</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Choose stop, repeat or</tspan><tspan x="75" dy="14">one specific</tspan><tspan x="75" dy="14">expansion.</tspan></text></g><rect x="288" y="362" width="884" height="280" rx="20" fill="#f8fbfd" stroke="#cbdce8"/><g transform="translate(320,395)"><rect width="150" height="46" rx="13" fill="#f5f9fd" stroke="#6f4cb8" stroke-width="1.4"/><text class="miniTitle" x="75.0" y="27" text-anchor="middle"><tspan x="75.0" dy="0">Calculations</tspan></text><text class="miniBody" x="75.0" y="52" text-anchor="middle"><tspan x="75.0" dy="0">prediction</tspan></text></g><g transform="translate(320,451)"><rect width="150" height="46" rx="13" fill="#f5f9fd" stroke="#6f4cb8" stroke-width="1.4"/><text class="miniTitle" x="75.0" y="27" text-anchor="middle"><tspan x="75.0" dy="0">Samples</tspan></text><text class="miniBody" x="75.0" y="52" text-anchor="middle"><tspan x="75.0" dy="0">physical evidence</tspan></text></g><g transform="translate(320,507)"><rect width="150" height="46" rx="13" fill="#f5f9fd" stroke="#6f4cb8" stroke-width="1.4"/><text class="miniTitle" x="75.0" y="27" text-anchor="middle"><tspan x="75.0" dy="0">Data</tspan></text><text class="miniBody" x="75.0" y="52" text-anchor="middle"><tspan x="75.0" dy="0">measurement</tspan></text></g><g transform="translate(320,563)"><rect width="150" height="46" rx="13" fill="#f5f9fd" stroke="#6f4cb8" stroke-width="1.4"/><text class="miniTitle" x="75.0" y="27" text-anchor="middle"><tspan x="75.0" dy="0">Costs</tspan></text><text class="miniBody" x="75.0" y="52" text-anchor="middle"><tspan x="75.0" dy="0">business evidence</tspan></text></g><g transform="translate(555,440)"><rect width="220" height="120" rx="13" fill="#ffffff" stroke="#6f4cb8" stroke-width="1.4"/><text class="miniTitle" x="110.0" y="27" text-anchor="middle"><tspan x="110.0" dy="0">Evidence package</tspan></text><text class="miniBody" x="110.0" y="52" text-anchor="middle"><tspan x="110.0" dy="0">report · code · raw data ·</tspan><tspan x="110.0" dy="14">charts · limits</tspan></text></g><path class="signal" d="M470 418H520V500H555"/><path class="signal" d="M470 474H520V500H555"/><path class="signal" d="M470 530H520V500H555"/><path class="signal" d="M470 586H520V500H555"/><g transform="translate(850,395)"><rect width="250" height="60" rx="13" fill="#ffffff" stroke="#d84d4d" stroke-width="1.4"/><text class="miniTitle" x="125.0" y="27" text-anchor="middle"><tspan x="125.0" dy="0">STOP</tspan></text><text class="miniBody" x="125.0" y="52" text-anchor="middle"><tspan x="125.0" dy="0">evidence rejects the idea</tspan></text></g><path class="decisionArrow" d="M775 500L835 425"/><g transform="translate(850,470)"><rect width="250" height="60" rx="13" fill="#ffffff" stroke="#e18a2d" stroke-width="1.4"/><text class="miniTitle" x="125.0" y="27" text-anchor="middle"><tspan x="125.0" dy="0">REPEAT</tspan></text><text class="miniBody" x="125.0" y="52" text-anchor="middle"><tspan x="125.0" dy="0">correct one known weakness</tspan></text></g><path class="decisionArrow" d="M775 500L835 500"/><g transform="translate(850,545)"><rect width="250" height="60" rx="13" fill="#ffffff" stroke="#42a963" stroke-width="1.4"/><text class="miniTitle" x="125.0" y="27" text-anchor="middle"><tspan x="125.0" dy="0">EXPAND</tspan></text><text class="miniBody" x="125.0" y="52" text-anchor="middle"><tspan x="125.0" dy="0">test one larger question</tspan></text></g><path class="decisionArrow" d="M775 500L835 575"/></g>
  <g class="ui" transform="translate(288,660)"><rect width="430" height="154" rx="18" fill="#fff" stroke="#6f4cb8" stroke-width="1.5"/><text class="section" x="20" y="29">EVIDENCE PRODUCED</text><circle cx="22" cy="53" r="3.5" fill="currentColor"/><text class="body" x="34" y="58" text-anchor="start"><tspan x="34" dy="0">first-year engineering report</tspan></text><circle cx="22" cy="78" r="3.5" fill="currentColor"/><text class="body" x="34" y="83" text-anchor="start"><tspan x="34" dy="0">one-page business summary</tspan></text><circle cx="22" cy="103" r="3.5" fill="currentColor"/><text class="body" x="34" y="108" text-anchor="start"><tspan x="34" dy="0">reproducible data and code package</tspan></text><circle cx="22" cy="128" r="3.5" fill="currentColor"/><text class="body" x="34" y="133" text-anchor="start"><tspan x="34" dy="0">final presentation and decision</tspan></text></g>
  <g class="ui" transform="translate(736,660)"><rect width="436" height="154" rx="18" fill="#294d75"/><text class="gateTitle" x="22" y="34">PASS / FAIL — G7</text><text class="gateBody" x="22" y="62" text-anchor="start"><tspan x="22" dy="0">An independent reader can trace the evidence, reproduce</tspan><tspan x="22" dy="18">the calculations and understand the recommended next</tspan><tspan x="22" dy="18">decision.</tspan></text></g>
  <g class="ui" transform="translate(288,832)"><rect width="884" height="60" rx="16" fill="#edf8f6" stroke="#6f4cb8"/><text class="section" x="20" y="25">HANDOFF TO THE NEXT PHASE</text><text class="handoff" x="260" y="36" text-anchor="start"><tspan x="260" dy="0">Archive the project passport and approved next-step recommendation.</tspan></text></g>

  <title id="title">D09 — Explain, present and decide</title>
  <desc id="desc">Explain, present and decide, Weeks 22–24. The diagram shows required inputs, tools, safety controls, five student actions, phase-specific system detail, evidence, G7, and the handoff.</desc>

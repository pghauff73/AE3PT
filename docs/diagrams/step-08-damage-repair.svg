  <title id="title">D08 — Damage, repair and retest</title>
  <desc id="desc">Damage, repair and retest, Weeks 19–21. The diagram shows required inputs, tools, safety controls, five student actions, phase-specific system detail, evidence, G6, and the handoff.</desc>

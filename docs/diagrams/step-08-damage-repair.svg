  <text class="title" x="155" y="76">Damage, repair and retest</text><text class="subtitle" x="155" y="106">Weeks 19–21 · Adaptive Electroformed 3D Power Topology Lite student project</text>
  <rect x="968" y="52" width="172" height="56" rx="14" fill="#153758" opacity=".86"/><text class="subtitle" x="1054" y="72" text-anchor="middle">Phase gate</text><text class="gateValue" x="1054" y="101" text-anchor="middle">G6</text></g>
  <g class="ui" transform="translate(28,156)"><rect width="1144" height="64" rx="16" fill="#fff" stroke="#cbdce8"/><text class="section" x="26" y="27" text-anchor="start"><tspan x="26" dy="0">WHY THIS PHASE EXISTS</tspan></text><text class="body" x="26" y="50" text-anchor="start"><tspan x="26" dy="0">Create a controlled local defect, restore copper under supervision and measure whether useful performance returns.</tspan></text></g>
  <g class="ui"><g transform="translate(28,238)"><rect width="240" height="158" rx="18" fill="#ffffff" stroke="#e6538d" stroke-width="1.5"/><text class="section" x="18" y="28">INPUTS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">tested repair-ready sample</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">approved damage location</tspan></text><circle cx="20" cy="101" r="3.5" fill="currentColor"/><text class="body" x="32" y="106" text-anchor="start"><tspan x="32" dy="0">repair mask and laboratory</tspan><tspan x="32" dy="17">access</tspan></text></g><g transform="translate(28,410)"><rect width="240" height="144" rx="18" fill="#ffffff" stroke="#e6538d" stroke-width="1.5"/><text class="section" x="18" y="28">TOOLS AND MATERIALS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">controlled abrasion or cut</tspan><tspan x="32" dy="17">fixture</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">inspection camera</tspan></text><circle cx="20" cy="118" r="3.5" fill="currentColor"/><text class="body" x="32" y="123" text-anchor="start"><tspan x="32" dy="0">same electrical and</tspan><tspan x="32" dy="17">temperature test system</tspan></text></g><g transform="translate(28,568)"><rect width="240" height="176" rx="18" fill="#fff8ef" stroke="#dd6b35" stroke-width="1.5"/><text class="section" x="18" y="28">SAFETY / STOP</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">contain sharp edges and</tspan><tspan x="32" dy="17">particles</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">record damage before</tspan><tspan x="32" dy="17">repair</tspan></text><circle cx="20" cy="135" r="3.5" fill="currentColor"/><text class="body" x="32" y="140" text-anchor="start"><tspan x="32" dy="0">repair plating remains</tspan><tspan x="32" dy="17">laboratory controlled</tspan></text></g></g>
  <g class="ui"><text class="detailHeading" x="302" y="190">Student action flow</text><g transform="translate(300,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#e6538d" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#e6538d"/><text class="stepNumber" x="22" y="27" text-anchor="middle">1</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Original</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Save baseline</tspan><tspan x="75" dy="14">resistance,</tspan><tspan x="75" dy="14">temperature and</tspan><tspan x="75" dy="14">photographs.</tspan></text></g><path class="arrow" d="M451 272L468 272"/><g transform="translate(470,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#e6538d" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#e6538d"/><text class="stepNumber" x="22" y="27" text-anchor="middle">2</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Damage</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Remove copper only in</tspan><tspan x="75" dy="14">the approved local</tspan><tspan x="75" dy="14">zone.</tspan></text></g><path class="arrow" d="M621 272L638 272"/><g transform="translate(640,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#e6538d" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#e6538d"/><text class="stepNumber" x="22" y="27" text-anchor="middle">3</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Measure</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Quantify the defect</tspan><tspan x="75" dy="14">before changing it</tspan><tspan x="75" dy="14">again.</tspan></text></g><path class="arrow" d="M791 272L808 272"/><g transform="translate(810,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#e6538d" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#e6538d"/><text class="stepNumber" x="22" y="27" text-anchor="middle">4</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Repair</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Clean, mask and</tspan><tspan x="75" dy="14">locally restore</tspan><tspan x="75" dy="14">copper.</tspan></text></g><path class="arrow" d="M961 272L978 272"/><g transform="translate(980,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#e6538d" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#e6538d"/><text class="stepNumber" x="22" y="27" text-anchor="middle">5</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Retest</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Repeat the original</tspan><tspan x="75" dy="14">current and</tspan><tspan x="75" dy="14">temperature sequence.</tspan></text></g><rect x="288" y="362" width="884" height="280" rx="20" fill="#f8fbfd" stroke="#cbdce8"/><g transform="translate(330,402)"><rect width="230" height="200" rx="16" fill="#fff" stroke="#e6538d" stroke-width="1.4"/><text class="miniTitle" x="115" y="30" text-anchor="middle">Original</text><text class="miniBody" x="115" y="52" text-anchor="middle">baseline</text><rect x="25" y="95" width="180" height="28" rx="10" fill="#d98632"/><text class="badgeText" x="115" y="166" text-anchor="middle">same test sequence</text></g><path class="arrow" d="M560 502L600 502"/><g transform="translate(610,402)"><rect width="230" height="200" rx="16" fill="#fff" stroke="#e6538d" stroke-width="1.4"/><text class="miniTitle" x="115" y="30" text-anchor="middle">Damaged</text><text class="miniBody" x="115" y="52" text-anchor="middle">local copper loss</text><rect x="25" y="95" width="180" height="28" rx="10" fill="#d98632"/><rect x="98" y="87" width="34" height="44" fill="#fff"/><path d="M98 87L132 131M132 87L98 131" stroke="#d84d4d" stroke-width="4"/><text class="badgeText" x="115" y="166" text-anchor="middle">same test sequence</text></g><path class="arrow" d="M840 502L880 502"/><g transform="translate(890,402)"><rect width="230" height="200" rx="16" fill="#fff" stroke="#e6538d" stroke-width="1.4"/><text class="miniTitle" x="115" y="30" text-anchor="middle">Repaired</text><text class="miniBody" x="115" y="52" text-anchor="middle">local copper restored</text><rect x="25" y="95" width="180" height="28" rx="10" fill="#d98632"/><rect x="96" y="89" width="38" height="40" rx="6" fill="#f0a45a" stroke="#e6538d" stroke-width="3"/><text class="badgeText" x="115" y="166" text-anchor="middle">same test sequence</text></g><text class="miniLabel" x="600" y="630" text-anchor="middle">COMPARE RESISTANCE · TEMPERATURE · TIME · MATERIAL · COST</text></g>
  <g class="ui" transform="translate(288,660)"><rect width="430" height="154" rx="18" fill="#fff" stroke="#e6538d" stroke-width="1.5"/><text class="section" x="20" y="29">EVIDENCE PRODUCED</text><circle cx="22" cy="53" r="3.5" fill="currentColor"/><text class="body" x="34" y="58" text-anchor="start"><tspan x="34" dy="0">original/damaged/repaired dataset</tspan></text><circle cx="22" cy="78" r="3.5" fill="currentColor"/><text class="body" x="34" y="83" text-anchor="start"><tspan x="34" dy="0">matched photographs</tspan></text><circle cx="22" cy="103" r="3.5" fill="currentColor"/><text class="body" x="34" y="108" text-anchor="start"><tspan x="34" dy="0">repair time and material cost</tspan></text><circle cx="22" cy="128" r="3.5" fill="currentColor"/><text class="body" x="34" y="133" text-anchor="start"><tspan x="34" dy="0">electrical and thermal recovery result</tspan></text></g>

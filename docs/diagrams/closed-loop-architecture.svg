<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AE3PT closed-loop simulator architecture</title>
  <desc id="desc">Requirements flow through topology, materials, physics, manufacturing, lifecycle, and optimization, with evidence surrounding the loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f4b5e"/></marker>
    <style>.box{fill:#eef7f5;stroke:#1f4b5e;stroke-width:2}.accent{fill:#fff1c7;stroke:#a45d00;stroke-width:2}.label{font:600 18px sans-serif;fill:#15313d}.small{font:14px sans-serif;fill:#294a57}.flow{stroke:#1f4b5e;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="18" y="18" width="1164" height="584" rx="26" fill="#fafcfc" stroke="#7a9aa5" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="600" y="48" text-anchor="middle" class="small">Immutable data, provenance, uncertainty, evidence, and approval envelope</text>
  <g transform="translate(70 95)"><rect class="box" width="210" height="78" rx="14"/><text x="105" y="34" text-anchor="middle" class="label">Mission</text><text x="105" y="57" text-anchor="middle" class="small">requirements and scenarios</text></g>
  <g transform="translate(365 95)"><rect class="box" width="210" height="78" rx="14"/><text x="105" y="34" text-anchor="middle" class="label">Topology</text><text x="105" y="57" text-anchor="middle" class="small">graph + functional field</text></g>
  <g transform="translate(660 95)"><rect class="box" width="210" height="78" rx="14"/><text x="105" y="34" text-anchor="middle" class="label">Materials</text><text x="105" y="57" text-anchor="middle" class="small">bulk + interfaces</text></g>
  <g transform="translate(920 95)"><rect class="box" width="210" height="78" rx="14"/><text x="105" y="34" text-anchor="middle" class="label">Physics</text><text x="105" y="57" text-anchor="middle" class="small">electro-thermal-mechanical</text></g>
  <g transform="translate(920 275)"><rect class="box" width="210" height="78" rx="14"/><text x="105" y="34" text-anchor="middle" class="label">Manufacture</text><text x="105" y="57" text-anchor="middle" class="small">print, seed, plate, inspect</text></g>
  <g transform="translate(660 455)"><rect class="box" width="210" height="78" rx="14"/><text x="105" y="34" text-anchor="middle" class="label">Lifecycle</text><text x="105" y="57" text-anchor="middle" class="small">damage, repair, reuse</text></g>
  <g transform="translate(365 455)"><rect class="box" width="210" height="78" rx="14"/><text x="105" y="34" text-anchor="middle" class="label">Economics</text><text x="105" y="57" text-anchor="middle" class="small">cost, mass, circularity</text></g>
  <g transform="translate(70 455)"><rect class="accent" width="210" height="78" rx="14"/><text x="105" y="34" text-anchor="middle" class="label">Optimization</text><text x="105" y="57" text-anchor="middle" class="small">BAB-CS + promotion</text></g>
  <path class="flow" d="M280 134 H365"/><path class="flow" d="M575 134 H660"/><path class="flow" d="M870 134 H920"/>
  <path class="flow" d="M1025 173 V275"/><path class="flow" d="M920 314 C820 314 820 494 870 494"/>
  <path class="flow" d="M660 494 H575"/><path class="flow" d="M365 494 H280"/>
  <path class="flow" d="M175 455 C175 365 175 260 175 173"/>
  <text x="600" y="330" text-anchor="middle" class="label">Design → Manufacture → Operate → Repair → Redesign</text>
</svg>

  <rect x="28" y="28" width="1144" height="112" rx="22" fill="url(#header)"/>
  <g class="ui"><rect x="54" y="52" width="78" height="56" rx="15" fill="#fff" opacity=".18"/><text class="title" x="93" y="90" text-anchor="middle" font-size="23">D03</text>
  <text class="title" x="155" y="76">Build the measurement tools</text><text class="subtitle" x="155" y="106">Weeks 4–7 · Adaptive Electroformed 3D Power Topology Lite student project</text>
  <rect x="968" y="52" width="172" height="56" rx="14" fill="#153758" opacity=".86"/><text class="subtitle" x="1054" y="72" text-anchor="middle">Phase gate</text><text class="gateValue" x="1054" y="101" text-anchor="middle">G1</text></g>
  <g class="ui" transform="translate(28,156)"><rect width="1144" height="64" rx="16" fill="#fff" stroke="#cbdce8"/><text class="section" x="26" y="27" text-anchor="start"><tspan x="26" dy="0">WHY THIS PHASE EXISTS</tspan></text><text class="body" x="26" y="50" text-anchor="start"><tspan x="26" dy="0">Build low-voltage instruments that measure current, sample voltage and four temperatures with traceable checks.</tspan></text></g>
  <g class="ui"><g transform="translate(28,238)"><rect width="240" height="158" rx="18" fill="#ffffff" stroke="#7659d7" stroke-width="1.5"/><text class="section" x="18" y="28">INPUTS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">5 V current-limited supply</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">current shunt and voltage</tspan><tspan x="32" dy="17">converter</tspan></text><circle cx="20" cy="118" r="3.5" fill="currentColor"/><text class="body" x="32" y="123" text-anchor="start"><tspan x="32" dy="0">four digital temperature</tspan><tspan x="32" dy="17">sensors</tspan></text></g><g transform="translate(28,410)"><rect width="240" height="144" rx="18" fill="#ffffff" stroke="#7659d7" stroke-width="1.5"/><text class="section" x="18" y="28">TOOLS AND MATERIALS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">microcontroller</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">breadboard then stripboard</tspan></text><circle cx="20" cy="101" r="3.5" fill="currentColor"/><text class="body" x="32" y="106" text-anchor="start"><tspan x="32" dy="0">trusted comparison meter</tspan></text></g><g transform="translate(28,568)"><rect width="240" height="176" rx="18" fill="#fff8ef" stroke="#dd6b35" stroke-width="1.5"/><text class="section" x="18" y="28">SAFETY / STOP</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">2.5 A fuse and main switch</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">guard load resistors</tspan></text><circle cx="20" cy="101" r="3.5" fill="currentColor"/><text class="body" x="32" y="106" text-anchor="start"><tspan x="32" dy="0">invalid sensor or 50 °C</tspan><tspan x="32" dy="17">reading stops the test</tspan></text></g></g>
  <g class="ui"><text class="detailHeading" x="302" y="190">Student action flow</text><g transform="translate(300,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#7659d7"/><text class="stepNumber" x="22" y="27" text-anchor="middle">1</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Build fixture</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Wire supply, fuse,</tspan><tspan x="75" dy="14">switch, load and</tspan><tspan x="75" dy="14">sample terminals.</tspan></text></g><path class="arrow" d="M451 272L468 272"/><g transform="translate(470,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#7659d7"/><text class="stepNumber" x="22" y="27" text-anchor="middle">2</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Measure current</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Read voltage across</tspan><tspan x="75" dy="14">the known current</tspan><tspan x="75" dy="14">shunt.</tspan></text></g><path class="arrow" d="M621 272L638 272"/><g transform="translate(640,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#7659d7"/><text class="stepNumber" x="22" y="27" text-anchor="middle">3</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Measure sample</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Use separate current</tspan><tspan x="75" dy="14">and voltage-sense</tspan><tspan x="75" dy="14">leads.</tspan></text></g><path class="arrow" d="M791 272L808 272"/><g transform="translate(810,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#7659d7"/><text class="stepNumber" x="22" y="27" text-anchor="middle">4</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Add temperature</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Identify and position</tspan><tspan x="75" dy="14">four sensor channels.</tspan></text></g><path class="arrow" d="M961 272L978 272"/><g transform="translate(980,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#7659d7"/><text class="stepNumber" x="22" y="27" text-anchor="middle">5</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Calibrate</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Compare references and</tspan><tspan x="75" dy="14">prove every stop</tspan><tspan x="75" dy="14">condition.</tspan></text></g><rect x="288" y="362" width="884" height="280" rx="20" fill="#f8fbfd" stroke="#cbdce8"/><text class="miniLabel" x="320" y="415">POWER PATH</text><g transform="translate(320,430)"><rect width="130" height="62" rx="13" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><text class="miniTitle" x="65.0" y="27" text-anchor="middle"><tspan x="65.0" dy="0">5 V supply</tspan></text><text class="miniBody" x="65.0" y="52" text-anchor="middle"><tspan x="65.0" dy="0">current path</tspan></text></g><path class="arrow" d="M450 461L474 461"/><g transform="translate(475,430)"><rect width="145" height="62" rx="13" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><text class="miniTitle" x="72.5" y="27" text-anchor="middle"><tspan x="72.5" dy="0">Fuse + switch</tspan></text><text class="miniBody" x="72.5" y="52" text-anchor="middle"><tspan x="72.5" dy="0">current path</tspan></text></g><path class="arrow" d="M620 461L644 461"/><g transform="translate(645,430)"><rect width="130" height="62" rx="13" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><text class="miniTitle" x="65.0" y="27" text-anchor="middle"><tspan x="65.0" dy="0">Sample</tspan></text><text class="miniBody" x="65.0" y="52" text-anchor="middle"><tspan x="65.0" dy="0">current path</tspan></text></g><path class="arrow" d="M775 461L799 461"/><g transform="translate(800,430)"><rect width="115" height="62" rx="13" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><text class="miniTitle" x="57.5" y="27" text-anchor="middle"><tspan x="57.5" dy="0">Load</tspan></text><text class="miniBody" x="57.5" y="52" text-anchor="middle"><tspan x="57.5" dy="0">current path</tspan></text></g><path class="arrow" d="M915 461L939 461"/><g transform="translate(940,430)"><rect width="115" height="62" rx="13" fill="#ffffff" stroke="#7659d7" stroke-width="1.4"/><text class="miniTitle" x="57.5" y="27" text-anchor="middle"><tspan x="57.5" dy="0">Shunt</tspan></text><text class="miniBody" x="57.5" y="52" text-anchor="middle"><tspan x="57.5" dy="0">current path</tspan></text></g><g transform="translate(430,545)"><rect width="155" height="62" rx="13" fill="#f4f0ff" stroke="#7659d7" stroke-width="1.4"/><text class="miniTitle" x="77.5" y="27" text-anchor="middle"><tspan x="77.5" dy="0">Voltage</tspan><tspan x="77.5" dy="15">converter</tspan></text><text class="miniBody" x="77.5" y="52" text-anchor="middle"><tspan x="77.5" dy="0">sample + shunt</tspan><tspan x="77.5" dy="14">sensing</tspan></text></g><g transform="translate(625,545)"><rect width="145" height="62" rx="13" fill="#f4f0ff" stroke="#7659d7" stroke-width="1.4"/><text class="miniTitle" x="72.5" y="27" text-anchor="middle"><tspan x="72.5" dy="0">Microcontroller</tspan></text><text class="miniBody" x="72.5" y="52" text-anchor="middle"><tspan x="72.5" dy="0">timestamp and</tspan><tspan x="72.5" dy="14">limits</tspan></text></g><g transform="translate(810,545)"><rect width="125" height="62" rx="13" fill="#edf8f6" stroke="#7659d7" stroke-width="1.4"/><text class="miniTitle" x="62.5" y="27" text-anchor="middle"><tspan x="62.5" dy="0">CSV data</tspan></text><text class="miniBody" x="62.5" y="52" text-anchor="middle"><tspan x="62.5" dy="0">raw readings</tspan></text></g><g transform="translate(965,525)"><rect width="150" height="82" rx="13" fill="#fff8ef" stroke="#7659d7" stroke-width="1.4"/><text class="miniTitle" x="75.0" y="27" text-anchor="middle"><tspan x="75.0" dy="0">4 temperature</tspan><tspan x="75.0" dy="15">sensors</tspan></text><text class="miniBody" x="75.0" y="52" text-anchor="middle"><tspan x="75.0" dy="0">ambient + three</tspan><tspan x="75.0" dy="14">sample points</tspan></text></g><path class="arrow" d="M585 576L625 576"/><path class="arrow" d="M770 576L810 576"/><path class="arrow" d="M935 576L965 566"/><path class="signal" d="M645 492V530H510V545"/><path class="signal" d="M955 492V515H510V545"/></g>
  <g class="ui" transform="translate(288,660)"><rect width="430" height="154" rx="18" fill="#fff" stroke="#7659d7" stroke-width="1.5"/><text class="section" x="20" y="29">EVIDENCE PRODUCED</text><circle cx="22" cy="53" r="3.5" fill="currentColor"/><text class="body" x="34" y="58" text-anchor="start"><tspan x="34" dy="0">wiring diagram</tspan></text><circle cx="22" cy="78" r="3.5" fill="currentColor"/><text class="body" x="34" y="83" text-anchor="start"><tspan x="34" dy="0">firmware and channel map</tspan></text><circle cx="22" cy="103" r="3.5" fill="currentColor"/><text class="body" x="34" y="108" text-anchor="start"><tspan x="34" dy="0">calibration table</tspan></text><circle cx="22" cy="128" r="3.5" fill="currentColor"/><text class="body" x="34" y="133" text-anchor="start"><tspan x="34" dy="0">fault and stop test record</tspan></text></g>
  <g class="ui" transform="translate(736,660)"><rect width="436" height="154" rx="18" fill="#294d75"/><text class="gateTitle" x="22" y="34">PASS / FAIL — G1</text><text class="gateBody" x="22" y="62" text-anchor="start"><tspan x="22" dy="0">Current and temperature readings are repeatable,</tspan><tspan x="22" dy="18">labelled and within the agreed classroom tolerance.</tspan></text></g>
  <g class="ui" transform="translate(288,832)"><rect width="884" height="60" rx="16" fill="#edf8f6" stroke="#7659d7"/><text class="section" x="20" y="25">HANDOFF TO THE NEXT PHASE</text><text class="handoff" x="260" y="36" text-anchor="start"><tspan x="260" dy="0">Provide verified measurements to the software phase.</tspan></text></g>

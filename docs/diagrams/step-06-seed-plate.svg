  <title id="title">D06 — Apply conductive seed and copper</title>
  <desc id="desc">Apply conductive seed and copper, Weeks 11–14. The diagram shows required inputs, tools, safety controls, five student actions, phase-specific system detail, evidence, G4, and the handoff.</desc>

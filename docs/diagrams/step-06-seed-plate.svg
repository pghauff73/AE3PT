  <text class="title" x="155" y="76">Apply conductive seed and copper</text><text class="subtitle" x="155" y="106">Weeks 11–14 · Adaptive Electroformed 3D Power Topology Lite student project</text>
  <rect x="968" y="52" width="172" height="56" rx="14" fill="#153758" opacity=".86"/><text class="subtitle" x="1054" y="72" text-anchor="middle">Phase gate</text><text class="gateValue" x="1054" y="101" text-anchor="middle">G4</text></g>
  <g class="ui" transform="translate(28,156)"><rect width="1144" height="64" rx="16" fill="#fff" stroke="#cbdce8"/><text class="section" x="26" y="27" text-anchor="start"><tspan x="26" dy="0">WHY THIS PHASE EXISTS</tspan></text><text class="body" x="26" y="50" text-anchor="start"><tspan x="26" dy="0">Use an approved seed and coupon-first laboratory process to make traceable copper-coated conductors.</tspan></text></g>
  <g class="ui"><g transform="translate(28,238)"><rect width="240" height="158" rx="18" fill="#ffffff" stroke="#f28d3c" stroke-width="1.5"/><text class="section" x="18" y="28">INPUTS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">clean labelled bases and</tspan><tspan x="32" dy="17">coupons</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">approved printed or</tspan><tspan x="32" dy="17">applied seed</tspan></text><circle cx="20" cy="135" r="3.5" fill="currentColor"/><text class="body" x="32" y="140" text-anchor="start"><tspan x="32" dy="0">approved copper-plating</tspan><tspan x="32" dy="17">process</tspan></text></g><g transform="translate(28,410)"><rect width="240" height="144" rx="18" fill="#ffffff" stroke="#f28d3c" stroke-width="1.5"/><text class="section" x="18" y="28">TOOLS AND MATERIALS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">masks and hanging fixtures</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">resistance and</tspan><tspan x="32" dy="17">voltage-drop check</tspan></text><circle cx="20" cy="118" r="3.5" fill="currentColor"/><text class="body" x="32" y="123" text-anchor="start"><tspan x="32" dy="0">scale, camera and process</tspan><tspan x="32" dy="17">traveller</tspan></text></g><g transform="translate(28,568)"><rect width="240" height="176" rx="18" fill="#fff8ef" stroke="#dd6b35" stroke-width="1.5"/><text class="section" x="18" y="28">SAFETY / STOP</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">laboratory owns chemistry</tspan><tspan x="32" dy="17">and waste</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">approved Personal</tspan><tspan x="32" dy="17">Protective Equipment</tspan></text><circle cx="20" cy="135" r="3.5" fill="currentColor"/><text class="body" x="32" y="140" text-anchor="start"><tspan x="32" dy="0">no student bath changes or</tspan><tspan x="32" dy="17">unsupervised plating</tspan></text></g></g>
  <g class="ui"><text class="detailHeading" x="302" y="190">Student action flow</text><g transform="translate(300,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#f28d3c" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#f28d3c"/><text class="stepNumber" x="22" y="27" text-anchor="middle">1</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Clean and mask</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Expose only the</tspan><tspan x="75" dy="14">intended conductive</tspan><tspan x="75" dy="14">route.</tspan></text></g><path class="arrow" d="M451 272L468 272"/><g transform="translate(470,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#f28d3c" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#f28d3c"/><text class="stepNumber" x="22" y="27" text-anchor="middle">2</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Apply seed</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Print or apply one</tspan><tspan x="75" dy="14">continuous conductive</tspan><tspan x="75" dy="14">route.</tspan></text></g><path class="arrow" d="M621 272L638 272"/><g transform="translate(640,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#f28d3c" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#f28d3c"/><text class="stepNumber" x="22" y="27" text-anchor="middle">3</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Check coupons</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Verify isolation,</tspan><tspan x="75" dy="14">resistance, voltage</tspan><tspan x="75" dy="14">drop and plating</tspan><tspan x="75" dy="14">access.</tspan></text></g><path class="arrow" d="M791 272L808 272"/><g transform="translate(810,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#f28d3c" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#f28d3c"/><text class="stepNumber" x="22" y="27" text-anchor="middle">4</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Plate copper</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Laboratory controls</tspan><tspan x="75" dy="14">current, time, flow</tspan><tspan x="75" dy="14">and chemistry.</tspan></text></g><path class="arrow" d="M961 272L978 272"/><g transform="translate(980,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#f28d3c" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#f28d3c"/><text class="stepNumber" x="22" y="27" text-anchor="middle">5</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Rinse and inspect</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Record mass,</tspan><tspan x="75" dy="14">appearance, defects</tspan><tspan x="75" dy="14">and continuity.</tspan></text></g><rect x="288" y="362" width="884" height="280" rx="20" fill="#f8fbfd" stroke="#cbdce8"/><g transform="translate(320,405)"><rect width="210" height="200" rx="16" fill="#fff" stroke="#ccdbe6"/><text class="miniTitle" x="105" y="28" text-anchor="middle">Coating cross-section</text><rect x="34" y="132" width="142" height="38" rx="7" fill="#d6e2ea"/><rect x="34" y="116" width="142" height="12" rx="4" fill="#34495e"/><rect x="34" y="82" width="142" height="30" rx="6" fill="#d98632"/><text class="miniBody" x="105" y="101" text-anchor="middle" fill="#fff">copper</text><text class="miniBody" x="105" y="126" text-anchor="middle" fill="#fff">printed or applied seed</text><text class="miniBody" x="105" y="154" text-anchor="middle">printed polymer</text></g><g transform="translate(565,410)"><rect width="160" height="72" rx="13" fill="#ffffff" stroke="#f28d3c" stroke-width="1.4"/><text class="miniTitle" x="80.0" y="27" text-anchor="middle"><tspan x="80.0" dy="0">Clean + mask</tspan></text><text class="miniBody" x="80.0" y="52" text-anchor="middle"><tspan x="80.0" dy="0">route exposed</tspan></text></g><path class="arrow" d="M725 446L745 446"/><g transform="translate(750,410)"><rect width="160" height="72" rx="13" fill="#ffffff" stroke="#f28d3c" stroke-width="1.4"/><text class="miniTitle" x="80.0" y="27" text-anchor="middle"><tspan x="80.0" dy="0">Seed</tspan></text><text class="miniBody" x="80.0" y="52" text-anchor="middle"><tspan x="80.0" dy="0">continuous route</tspan></text></g><path class="arrow" d="M910 446L930 446"/><g transform="translate(935,410)"><rect width="160" height="72" rx="13" fill="#ffffff" stroke="#f28d3c" stroke-width="1.4"/><text class="miniTitle" x="80.0" y="27" text-anchor="middle"><tspan x="80.0" dy="0">Coupon gate</tspan></text><text class="miniBody" x="80.0" y="52" text-anchor="middle"><tspan x="80.0" dy="0">R + drop + coverage</tspan></text></g><g transform="translate(660,520)"><rect width="160" height="72" rx="13" fill="#fff8ef" stroke="#f28d3c" stroke-width="1.4"/><text class="miniTitle" x="80.0" y="27" text-anchor="middle"><tspan x="80.0" dy="0">Copper plate</tspan></text><text class="miniBody" x="80.0" y="52" text-anchor="middle"><tspan x="80.0" dy="0">lab controlled</tspan></text></g><g transform="translate(880,520)"><rect width="160" height="72" rx="13" fill="#ffffff" stroke="#f28d3c" stroke-width="1.4"/><text class="miniTitle" x="80.0" y="27" text-anchor="middle"><tspan x="80.0" dy="0">Inspect</tspan></text><text class="miniBody" x="80.0" y="52" text-anchor="middle"><tspan x="80.0" dy="0">mass + defects</tspan></text></g><path class="arrow" d="M1035 446V505H820V520"/><path class="arrow" d="M820 556H870"/></g>
  <g class="ui" transform="translate(288,660)"><rect width="430" height="154" rx="18" fill="#fff" stroke="#f28d3c" stroke-width="1.5"/><text class="section" x="20" y="29">EVIDENCE PRODUCED</text><circle cx="22" cy="53" r="3.5" fill="currentColor"/><text class="body" x="34" y="58" text-anchor="start"><tspan x="34" dy="0">completed process travellers</tspan></text><circle cx="22" cy="78" r="3.5" fill="currentColor"/><text class="body" x="34" y="83" text-anchor="start"><tspan x="34" dy="0">seed resistance and voltage-drop record</tspan></text><circle cx="22" cy="103" r="3.5" fill="currentColor"/><text class="body" x="34" y="108" text-anchor="start"><tspan x="34" dy="0">before/after mass and photographs</tspan></text><circle cx="22" cy="128" r="3.5" fill="currentColor"/><text class="body" x="34" y="133" text-anchor="start"><tspan x="34" dy="0">defect and continuity map</tspan></text></g>
  <g class="ui" transform="translate(736,660)"><rect width="436" height="154" rx="18" fill="#294d75"/><text class="gateTitle" x="22" y="34">PASS / FAIL — G4</text><text class="gateBody" x="22" y="62" text-anchor="start"><tspan x="22" dy="0">Coupon plating covers the full intended route before</tspan><tspan x="22" dy="18">samples proceed; all samples retain identities, records</tspan><tspan x="22" dy="18">and visible defects.</tspan></text></g>
  <g class="ui" transform="translate(288,832)"><rect width="884" height="60" rx="16" fill="#edf8f6" stroke="#f28d3c"/><text class="section" x="20" y="25">HANDOFF TO THE NEXT PHASE</text><text class="handoff" x="260" y="36" text-anchor="start"><tspan x="260" dy="0">Release plated samples only after laboratory and traceability review.</tspan></text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">AE3PT spatial functional field</title>
  <desc id="desc">A conductor region carries overlapping electrical, thermal, structural, manufacturing, repair, cost, and lifetime roles.</desc>
  <defs><style>.t{font:600 19px sans-serif;fill:#173846}.s{font:14px sans-serif;fill:#355966}.cell{stroke:#fff;stroke-width:2}.call{fill:#fff;stroke:#315e70;stroke-width:2}.line{stroke:#315e70;stroke-width:2;fill:none}</style></defs>
  <text x="550" y="36" text-anchor="middle" class="t">A(x) = {M, E, T, B, S, F, R, C, L}</text>
  <g transform="translate(90 100)">
    <rect x="0" y="0" width="520" height="360" rx="26" fill="#d9e9ec"/>
    <path d="M40 180 C120 40 210 60 270 150 C330 240 410 90 480 180 C410 300 300 320 220 250 C150 190 90 330 40 180Z" fill="#d9822b" opacity="0.9"/>
    <path d="M120 200 C210 120 290 160 400 205" stroke="#2b6cb0" stroke-width="42" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M80 280 L200 250 L300 310 L440 270" stroke="#546e2a" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.75"/>
    <circle cx="165" cy="158" r="36" fill="#f6e05e"/><circle cx="405" cy="205" r="34" fill="#f6e05e"/>
    <rect x="20" y="20" width="480" height="320" rx="18" fill="none" stroke="#315e70" stroke-width="3" stroke-dasharray="7 6"/>
  </g>
  <g transform="translate(690 85)"><rect class="call" width="320" height="62" rx="12"/><text x="18" y="27" class="t">Electrical</text><text x="18" y="49" class="s">current path and loss sensitivity</text></g>
  <g transform="translate(690 165)"><rect class="call" width="320" height="62" rx="12"/><text x="18" y="27" class="t">Thermal / Fluid</text><text x="18" y="49" class="s">heat path, coolant wall, hotspot</text></g>
  <g transform="translate(690 245)"><rect class="call" width="320" height="62" rx="12"/><text x="18" y="27" class="t">Structural</text><text x="18" y="49" class="s">rib, pressure wall, mount support</text></g>
  <g transform="translate(690 325)"><rect class="call" width="320" height="62" rx="12"/><text x="18" y="27" class="t">Manufacturing</text><text x="18" y="49" class="s">print, seed, electrolyte, tool access</text></g>
  <g transform="translate(690 405)"><rect class="call" width="320" height="62" rx="12"/><text x="18" y="27" class="t">Repair / Lifecycle</text><text x="18" y="49" class="s">inspection, replating, remaining life</text></g>
  <path class="line" d="M610 170H690"/><path class="line" d="M610 210C650 210 650 196 690 196"/><path class="line" d="M610 300C650 300 650 276 690 276"/><path class="line" d="M610 360C650 360 650 356 690 356"/><path class="line" d="M610 420C650 420 650 436 690 436"/>
  <text x="550" y="550" text-anchor="middle" class="t">One spatial region may perform several functions simultaneously</text>
</svg>

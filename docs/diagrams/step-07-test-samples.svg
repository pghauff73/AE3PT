<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">D07 — Test all nine samples</title>
  <desc id="desc">Test all nine samples, Weeks 15–18. The diagram shows required inputs, tools, safety controls, five student actions, phase-specific system detail, evidence, G5, and the handoff.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55bd70"/><stop offset="1" stop-color="#304e83"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17364a" flood-opacity="0.13"/></filter>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L0 8L9 4Z" fill="#54728a"/></marker>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font:800 31px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.subtitle{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#e9f3ff}.gateValue{font:800 28px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.gateValueLong{font:800 15px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.section{font:800 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.08em;fill:#214158}.body{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#48657a}.detailHeading{font:800 17px Inter,Segoe UI,Arial,sans-serif;fill:#18384d}.stepNumber{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.actionTitle{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#17384d}.actionBody{font:500 10.5px Inter,Segoe UI,Arial,sans-serif;fill:#5a7487}.miniTitle{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#18384d}.miniBody{font:500 10.5px Inter,Segoe UI,Arial,sans-serif;fill:#5a7487}.miniLabel{font:800 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.08em;fill:#567388}.badgeText{font:750 12px Inter,Segoe UI,Arial,sans-serif;fill:#26485d}.gateTitle{font:850 18px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.gateBody{font:550 12px Inter,Segoe UI,Arial,sans-serif;fill:#eaf4ff}.handoff{font:750 13px Inter,Segoe UI,Arial,sans-serif;fill:#24475d}.arrow{stroke:#54728a;stroke-width:2;fill:none;marker-end:url(#arrowhead)}.returnArrow{stroke:#6a8090;stroke-width:1.8;fill:none;stroke-dasharray:6 5;marker-end:url(#arrowhead)}.signal{stroke:#7659d7;stroke-width:1.8;fill:none;stroke-dasharray:4 4;marker-end:url(#arrowhead)}.decisionArrow{stroke:#6f4cb8;stroke-width:1.8;fill:none;marker-end:url(#arrowhead)}
    </style>
  </defs>
  <rect width="1200" height="920" rx="28" fill="#edf3f8"/>
  <rect x="28" y="28" width="1144" height="112" rx="22" fill="url(#header)"/>
  <g class="ui"><rect x="54" y="52" width="78" height="56" rx="15" fill="#fff" opacity=".18"/><text class="title" x="93" y="90" text-anchor="middle" font-size="23">D07</text>
  <text class="title" x="155" y="76">Test all nine samples</text><text class="subtitle" x="155" y="106">Weeks 15–18 · Adaptive Electroformed 3D Power Topology Lite student project</text>
  <rect x="968" y="52" width="172" height="56" rx="14" fill="#153758" opacity=".86"/><text class="subtitle" x="1054" y="72" text-anchor="middle">Phase gate</text><text class="gateValue" x="1054" y="101" text-anchor="middle">G5</text></g>
  <g class="ui" transform="translate(28,156)"><rect width="1144" height="64" rx="16" fill="#fff" stroke="#cbdce8"/><text class="section" x="26" y="27" text-anchor="start"><tspan x="26" dy="0">WHY THIS PHASE EXISTS</tspan></text><text class="body" x="26" y="50" text-anchor="start"><tspan x="26" dy="0">Measure every design at the same low-voltage conditions so electrical, thermal and manufacturing differences are comparable.</tspan></text></g>
  <g class="ui"><g transform="translate(28,238)"><rect width="240" height="158" rx="18" fill="#ffffff" stroke="#55bd70" stroke-width="1.5"/><text class="section" x="18" y="28">INPUTS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">nine plated samples</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">verified fixture and</tspan><tspan x="32" dy="17">loggers</tspan></text><circle cx="20" cy="118" r="3.5" fill="currentColor"/><text class="body" x="32" y="123" text-anchor="start"><tspan x="32" dy="0">randomized sample order</tspan></text></g><g transform="translate(28,410)"><rect width="240" height="144" rx="18" fill="#ffffff" stroke="#55bd70" stroke-width="1.5"/><text class="section" x="18" y="28">TOOLS AND MATERIALS</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">four-wire sample</tspan><tspan x="32" dy="17">connection</tspan></text><circle cx="20" cy="93" r="3.5" fill="currentColor"/><text class="body" x="32" y="98" text-anchor="start"><tspan x="32" dy="0">four temperature channels</tspan></text><circle cx="20" cy="118" r="3.5" fill="currentColor"/><text class="body" x="32" y="123" text-anchor="start"><tspan x="32" dy="0">raw-data and observation</tspan><tspan x="32" dy="17">forms</tspan></text></g><g transform="translate(28,568)"><rect width="240" height="176" rx="18" fill="#fff8ef" stroke="#dd6b35" stroke-width="1.5"/><text class="section" x="18" y="28">SAFETY / STOP</text><circle cx="20" cy="51" r="3.5" fill="currentColor"/><text class="body" x="32" y="56" text-anchor="start"><tspan x="32" dy="0">stop above 2 A or at 50 °C</tspan></text><circle cx="20" cy="76" r="3.5" fill="currentColor"/><text class="body" x="32" y="81" text-anchor="start"><tspan x="32" dy="0">stop on invalid sensor or</tspan><tspan x="32" dy="17">loose connection</tspan></text><circle cx="20" cy="118" r="3.5" fill="currentColor"/><text class="body" x="32" y="123" text-anchor="start"><tspan x="32" dy="0">stop for smoke, smell or</tspan><tspan x="32" dy="17">unexpected heating</tspan></text></g></g>
  <g class="ui"><text class="detailHeading" x="302" y="190">Student action flow</text><g transform="translate(300,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#55bd70"/><text class="stepNumber" x="22" y="27" text-anchor="middle">1</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Inspect</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Check identity,</tspan><tspan x="75" dy="14">surface, terminals and</tspan><tspan x="75" dy="14">room temperature.</tspan></text></g><path class="arrow" d="M451 272L468 272"/><g transform="translate(470,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#55bd70"/><text class="stepNumber" x="22" y="27" text-anchor="middle">2</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Connect</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Use repeatable clamps</tspan><tspan x="75" dy="14">and separate sense</tspan><tspan x="75" dy="14">leads.</tspan></text></g><path class="arrow" d="M621 272L638 272"/><g transform="translate(640,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#55bd70"/><text class="stepNumber" x="22" y="27" text-anchor="middle">3</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Run levels</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Test approximately 0.5</tspan><tspan x="75" dy="14">A, 1.0 A and 1.8 A.</tspan></text></g><path class="arrow" d="M791 272L808 272"/><g transform="translate(810,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#55bd70"/><text class="stepNumber" x="22" y="27" text-anchor="middle">4</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Repeat</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Retest enough to</tspan><tspan x="75" dy="14">estimate measurement</tspan><tspan x="75" dy="14">variation.</tspan></text></g><path class="arrow" d="M961 272L978 272"/><g transform="translate(980,210)"><rect width="150" height="125" rx="15" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><circle cx="22" cy="22" r="14" fill="#55bd70"/><text class="stepNumber" x="22" y="27" text-anchor="middle">5</text><text class="actionTitle" x="75" y="51" text-anchor="middle"><tspan x="75" dy="0">Compare</tspan></text><text class="actionBody" x="75" y="79" text-anchor="middle"><tspan x="75" dy="0">Analyse resistance,</tspan><tspan x="75" dy="14">temperature, yield and</tspan><tspan x="75" dy="14">model error.</tspan></text></g><rect x="288" y="362" width="884" height="280" rx="20" fill="#f8fbfd" stroke="#cbdce8"/><text class="miniLabel" x="320" y="413">REPEATABLE TEST PATH</text><g transform="translate(320,430)"><rect width="145" height="66" rx="13" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><text class="miniTitle" x="72.5" y="27" text-anchor="middle"><tspan x="72.5" dy="0">Randomized ID</tspan></text><text class="miniBody" x="72.5" y="52" text-anchor="middle"><tspan x="72.5" dy="0">same method</tspan></text></g><path class="arrow" d="M465 463L483 463"/><g transform="translate(485,430)"><rect width="105" height="66" rx="13" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><text class="miniTitle" x="52.5" y="27" text-anchor="middle"><tspan x="52.5" dy="0">Inspect</tspan></text><text class="miniBody" x="52.5" y="52" text-anchor="middle"><tspan x="52.5" dy="0">same method</tspan></text></g><path class="arrow" d="M590 463L608 463"/><g transform="translate(610,430)"><rect width="145" height="66" rx="13" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><text class="miniTitle" x="72.5" y="27" text-anchor="middle"><tspan x="72.5" dy="0">4-wire connect</tspan></text><text class="miniBody" x="72.5" y="52" text-anchor="middle"><tspan x="72.5" dy="0">same method</tspan></text></g><path class="arrow" d="M755 463L773 463"/><g transform="translate(775,430)"><rect width="130" height="66" rx="13" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><text class="miniTitle" x="65.0" y="27" text-anchor="middle"><tspan x="65.0" dy="0">Run current</tspan></text><text class="miniBody" x="65.0" y="52" text-anchor="middle"><tspan x="65.0" dy="0">same method</tspan></text></g><path class="arrow" d="M905 463L923 463"/><g transform="translate(925,430)"><rect width="145" height="66" rx="13" fill="#ffffff" stroke="#55bd70" stroke-width="1.4"/><text class="miniTitle" x="72.5" y="27" text-anchor="middle"><tspan x="72.5" dy="0">Save raw data</tspan></text><text class="miniBody" x="72.5" y="52" text-anchor="middle"><tspan x="72.5" dy="0">same method</tspan></text></g><g transform="translate(490,535)"><rect width="125" height="44" rx="22" fill="#55bd70" opacity="0.16"/><text class="badgeText" x="62" y="28" text-anchor="middle">≈ 0.5 A</text></g><g transform="translate(640,535)"><rect width="125" height="44" rx="22" fill="#55bd70" opacity="0.16"/><text class="badgeText" x="62" y="28" text-anchor="middle">≈ 1.0 A</text></g><g transform="translate(790,535)"><rect width="125" height="44" rx="22" fill="#55bd70" opacity="0.16"/><text class="badgeText" x="62" y="28" text-anchor="middle">≈ 1.8 A</text></g><g transform="translate(955,525)"><rect width="165" height="70" rx="13" fill="#fff1f1" stroke="#d84d4d" stroke-width="1.4"/><text class="miniTitle" x="82.5" y="27" text-anchor="middle"><tspan x="82.5" dy="0">STOP</tspan></text><text class="miniBody" x="82.5" y="52" text-anchor="middle"><tspan x="82.5" dy="0">&gt;2 A · ≥50 °C ·</tspan><tspan x="82.5" dy="14">invalid sensor</tspan></text></g><path class="signal" d="M875 496V550H955"/></g>
  <g class="ui" transform="translate(288,660)"><rect width="430" height="154" rx="18" fill="#fff" stroke="#55bd70" stroke-width="1.5"/><text class="section" x="20" y="29">EVIDENCE PRODUCED</text><circle cx="22" cy="53" r="3.5" fill="currentColor"/><text class="body" x="34" y="58" text-anchor="start"><tspan x="34" dy="0">raw time-series tables</tspan></text><circle cx="22" cy="78" r="3.5" fill="currentColor"/><text class="body" x="34" y="83" text-anchor="start"><tspan x="34" dy="0">resistance and temperature plots</tspan></text><circle cx="22" cy="103" r="3.5" fill="currentColor"/><text class="body" x="34" y="108" text-anchor="start"><tspan x="34" dy="0">uncertainty note</tspan></text><circle cx="22" cy="128" r="3.5" fill="currentColor"/><text class="body" x="34" y="133" text-anchor="start"><tspan x="34" dy="0">three-design comparison and yield</tspan></text></g>
  <g class="ui" transform="translate(736,660)"><rect width="436" height="154" rx="18" fill="#294d75"/><text class="gateTitle" x="22" y="34">PASS / FAIL — G5</text><text class="gateBody" x="22" y="62" text-anchor="start"><tspan x="22" dy="0">All samples, including failures, are represented and</tspan><tspan x="22" dy="18">repeated results are stable enough for an honest</tspan><tspan x="22" dy="18">comparison.</tspan></text></g>
  <g class="ui" transform="translate(288,832)"><rect width="884" height="60" rx="16" fill="#edf8f6" stroke="#55bd70"/><text class="section" x="20" y="25">HANDOFF TO THE NEXT PHASE</text><text class="handoff" x="260" y="36" text-anchor="start"><tspan x="260" dy="0">Select one repair-ready sample for controlled damage.</tspan></text></g>
</svg>
